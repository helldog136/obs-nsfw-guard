name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Vérifier que le tag correspond à la version du projet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(obs-nsfw-guard VERSION ([\d.]+)').Matches[0].Groups[1].Value
          if ($tag -ne $version) { throw "Le tag v$tag ne correspond pas à la version du CMakeLists.txt ($version)" }

      - name: Cache des dépendances
        uses: actions/cache@v6
        with:
          path: |
            deps
            models
          key: deps-${{ hashFiles('scripts/fetch-deps.ps1') }}

      - name: Récupérer les dépendances
        run: ./scripts/fetch-deps.ps1 -DownloadObs

      - name: Compiler
        run: ./scripts/build.ps1

      - name: Créer l'archive
        run: ./scripts/package.ps1

      - name: Installer Inno Setup si absent
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Créer l'installeur
        run: ./scripts/installer.ps1

      - name: Somme de contrôle
        run: |
          Get-ChildItem dist/* -Include *.zip, *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }

      - uses: actions/upload-artifact@v7
        with:
          name: obs-nsfw-guard-windows-x64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publier la release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: obs-nsfw-guard-windows-x64
          path: dist

      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "NSFW Guard ${{ github.ref_name }}" \
            --generate-notes
