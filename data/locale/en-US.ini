NsfwGuard="NSFW Guard"
Threshold="Sensitivity threshold (%)"
Threshold.Desc="Score above which a frame is considered sensitive. Lower = stricter (more false positives), higher = more permissive."
SexyWeight="Weight of the 'sexy' class (%)"
SexyWeight.Desc="How much borderline content (swimwear, lingerie) counts toward the score. 0 = only explicit content counts."
Consecutive="Consecutive detections required"
Consecutive.Desc="Number of positive analyses in a row before masking. Higher values remove isolated false positives."
HoldMs="Keep mask for (ms)"
Mode="Mask style"
Mode.Black="Black"
Mode.Pixelate="Pixelate"
Mode.Blur="Gaussian blur"
PixelSize="Pixel size (source px)"
PixelSize.Desc="Size of one pixelation block. Smaller = more legible, larger = more hidden."
BlurStrength="Blur strength"
BlurStrength.Desc="Standard deviation of the Gaussian blur, in source pixels. Higher = blurrier."
DelayOn="Delay the image so the mask arrives in time"
DelayOn.Desc="Buffers a few frames so the mask is applied before a detected frame is shown. Adds a small video delay to this source only."
AutoDelay="Compute the delay automatically"
DelayFrames="Delay (frames)"
Interval="Analyze one frame out of"
Method="Analysis method"
Method.Desc="The whole frame is shrunk to 224x224 before analysis, which can erase small elements. The other methods also look at zones of the frame, shrunk less. A random zone changes at every analysis and is re-analyzed as long as it stays positive."
Method.Whole="Whole frame, shrunk (1 analysis, lightest)"
Method.Zone="Random zone (1 analysis, more detail on part of the screen)"
Method.Mixed="Mixed: whole frame + random zone (2 analyses)"
Method.Grid2="Whole frame + fixed 2x2 grid (5 analyses, about 5x the compute)"
Method.Grid3="Whole frame + fixed 3x3 grid (10 analyses, about 10x the compute)"
Method.Grid4="Whole frame + fixed 4x4 grid (17 analyses, about 17x the compute)"
ZoneSize="Random zone size (source px)"
ZoneSize.Desc="Side of the square zone that is analyzed. 224 = source pixels as they are (most detailed). Larger = wider zone, but shrunk (a bit less detailed)."
Method.WarningLabel="Warning"
Method.Warning="This method multiplies the analysis work: it uses noticeably more CPU (or GPU) and lengthens the automatic video delay. Watch your CPU usage and enable the debug log to see the analysis time. On a modest machine, keep 'Whole frame' or 'Random zone', or raise the analysis interval."
Engine="Analysis engine"
Engine.Desc="MobileNet: light classifier shipped with the plugin, it judges the whole frame. NudeNet: detector that finds body parts and reports where they are, so only the affected area can be masked. NudeNet models are not shipped with the plugin (test version)."
Engine.MobileNet="MobileNet classifier (light, whole frame)"
Engine.NudeNet320n="NudeNet 320n detector (fast)"
Engine.NudeNet640m="NudeNet 640m detector (more accurate, heavier)"
Engine.WarningLabel="Warning"
Engine.Warning="Be careful with the GPU (DirectML) and the 640m model: during a test, one PC froze completely (black screen, forced restart) right after the 640m model was loaded on the GPU. The cause is not established, as that PC already had such crashes without this plugin. The CPU is enough: the 320n model takes about 9 ms per analysis on a Ryzen 7 5800X. The 640m on the CPU is too slow (about 220 ms per analysis) and will not keep up with the video."
DetThreshold="Minimum detection confidence (%)"
DetThreshold.Desc="A body part only counts if the model is at least this sure. Lower = more sensitive (more false positives), higher = more permissive. Enable the debug log to see the actual scores."
Classes="Body parts that trigger the mask"
Class.0="Female genitalia (covered)"
Class.1="Female face"
Class.2="Buttocks (exposed)"
Class.3="Female breast (exposed)"
Class.4="Female genitalia (exposed)"
Class.5="Male chest (exposed)"
Class.6="Anus (exposed)"
Class.7="Feet (exposed)"
Class.8="Belly (covered)"
Class.9="Feet (covered)"
Class.10="Armpits (covered)"
Class.11="Armpits (exposed)"
Class.12="Male face"
Class.13="Belly (exposed)"
Class.14="Male genitalia (exposed)"
Class.15="Anus (covered)"
Class.16="Female breast (covered)"
Class.17="Buttocks (covered)"
Localized="Only mask the detected area"
Localized.Desc="Only the part of the frame where the content is detected is blurred, pixelated or blacked out; the rest of the source stays visible. Off: the whole source is masked."
RegionMargin="Margin around the area (%)"
RegionMargin.Desc="Grows the masked area beyond the detected box, as a percentage of its size, to cover the edges and the slight offset caused by movement."
UseDml="Use the GPU (DirectML) instead of the CPU"
UseDml.Desc="The CPU is enough (about 1 ms per frame) and does not compete with the game for the GPU. A complete PC freeze was observed once when testing the GPU with the large NudeNet model: if in doubt, keep the CPU."
BlockUntilReady="Hide the source until the AI model is ready"
Debug="Log scores and timings (debug)"
