NsfwGuard="NSFW Guard"
Threshold="Sensitivity threshold (%)"
Threshold.Desc="Score above which a frame is considered sensitive. Lower = stricter (more false positives), higher = more permissive."
SexyWeight="Weight of the 'sexy' class (%)"
SexyWeight.Desc="How much borderline content (swimwear, lingerie) counts toward the score. 0 = only explicit content counts."
Consecutive="Consecutive detections required"
Consecutive.Desc="Number of positive analyses in a row before masking. Higher values remove isolated false positives."
HoldMs="Keep mask for (ms)"
Mode="Mask style"
Mode.Black="Black"
Mode.Pixelate="Pixelate"
Mode.Blur="Gaussian blur"
PixelSize="Pixel size (source px)"
PixelSize.Desc="Size of one pixelation block. Smaller = more legible, larger = more hidden."
BlurStrength="Blur strength"
BlurStrength.Desc="Standard deviation of the Gaussian blur, in source pixels. Higher = blurrier."
DelayOn="Delay the image so the mask arrives in time"
DelayOn.Desc="Buffers a few frames so the mask is applied before a detected frame is shown. Adds a small video delay to this source only."
AutoDelay="Compute the delay automatically"
DelayFrames="Delay (frames)"
Interval="Analyze one frame out of"
Method="Analysis method"
Method.Desc="The whole frame is shrunk to 224x224 before analysis, which can erase small elements. The other methods also look at zones of the frame, shrunk less. A random zone changes at every analysis and is re-analyzed as long as it stays positive."
Method.Whole="Whole frame, shrunk (1 analysis, lightest)"
Method.Zone="Random zone (1 analysis, more detail on part of the screen)"
Method.Mixed="Mixed: whole frame + random zone (2 analyses)"
Method.Grid2="Whole frame + fixed 2x2 grid (5 analyses, about 5x the compute)"
Method.Grid3="Whole frame + fixed 3x3 grid (10 analyses, about 10x the compute)"
Method.Grid4="Whole frame + fixed 4x4 grid (17 analyses, about 17x the compute)"
ZoneSize="Random zone size (source px)"
ZoneSize.Desc="Side of the square zone that is analyzed. 224 = source pixels as they are (most detailed). Larger = wider zone, but shrunk (a bit less detailed)."
Method.WarningLabel="Warning"
Method.Warning="This method multiplies the analysis work: it uses noticeably more CPU (or GPU) and lengthens the automatic video delay. Watch your CPU usage and enable the debug log to see the analysis time. On a modest machine, keep 'Whole frame' or 'Random zone', or raise the analysis interval."
