NsfwGuard="NSFW Guard"
Threshold="Sensitivity threshold (%)"
Threshold.Desc="Score above which a frame is considered sensitive. Lower = stricter (more false positives), higher = more permissive."
SexyWeight="Weight of the 'sexy' class (%)"
SexyWeight.Desc="How much borderline content (swimwear, lingerie) counts toward the score. 0 = only explicit content counts."
Consecutive="Consecutive detections required"
Consecutive.Desc="Number of positive analyses in a row before masking. Higher values remove isolated false positives."
HoldMs="Keep mask for (ms)"
Mode="Mask style"
Mode.Black="Black"
Mode.Pixelate="Pixelate"
Mode.Blur="Gaussian blur"
PixelSize="Pixel size (source px)"
PixelSize.Desc="Size of one pixelation block. Smaller = more legible, larger = more hidden."
BlurStrength="Blur strength"
BlurStrength.Desc="Standard deviation of the Gaussian blur, in source pixels. Higher = blurrier."
DelayOn="Delay the image so the mask arrives in time"
DelayOn.Desc="Buffers a few frames so the mask is applied before a detected frame is shown. Adds a small video delay to this source only."
AutoDelay="Compute the delay automatically"
DelayFrames="Delay (frames)"
Interval="Analyze one frame out of"
UseDml="Use the GPU (DirectML) instead of the CPU"
UseDml.Desc="The CPU is enough (about 1 ms per frame) and does not compete with the game for the GPU."
BlockUntilReady="Hide the source until the AI model is ready"
Debug="Log scores and timings (debug)"
