Engine="Analysis engine"
Engine.Desc="MobileNet: light classifier shipped with the plugin, it judges the whole frame. NudeNet: detector that finds body parts and reports where they are, so only the affected area can be masked. NudeNet models are not shipped with the plugin (test version)."
Engine.MobileNet="MobileNet classifier (light, whole frame)"
Engine.NudeNet320n="NudeNet 320n detector (fast)"
Engine.NudeNet640m="NudeNet 640m detector (more accurate, heavier)"
Engine.WarningLabel="Warning"
Engine.Warning="Be careful with the GPU (DirectML) and the 640m model: during a test, one PC froze completely (black screen, forced restart) right after the 640m model was loaded on the GPU. The cause is not established, as that PC already had such crashes without this plugin. The CPU is enough: the 320n model takes about 9 ms per analysis on a Ryzen 7 5800X. The 640m on the CPU is too slow (about 220 ms per analysis) and will not keep up with the video."
DetThreshold="Minimum detection confidence (%)"
DetThreshold.Desc="A body part only counts if the model is at least this sure. Lower = more sensitive (more false positives), higher = more permissive. Enable the debug log to see the actual scores."
Classes="Body parts that trigger the mask"
Class.0="Female genitalia (covered)"
