Class.15="Anus (covered)"
Class.16="Female breast (covered)"
Class.17="Buttocks (covered)"
Localized="Only mask the detected area"
Localized.Desc="Only the part of the frame where the content is detected is blurred, pixelated or blacked out; the rest of the source stays visible. Off: the whole source is masked."
RegionMargin="Margin around the area (%)"
RegionMargin.Desc="Grows the masked area beyond the detected box, as a percentage of its size, to cover the edges and the slight offset caused by movement."
UseDml="Use the GPU (DirectML) instead of the CPU"
UseDml.Desc="The CPU is enough (about 1 ms per frame) and does not compete with the game for the GPU. A complete PC freeze was observed once when testing the GPU with the large NudeNet model: if in doubt, keep the CPU."
Debug="Log scores and timings (debug)"
BlockUntilReady="Hide the source until the AI analysis works"
BlockUntilReady.Desc="Recommended. The source stays hidden while the model loads, if it cannot be loaded, and if the analysis stops returning results for a few seconds. Uncheck only if you prefer the source to stay visible when the analysis fails."
