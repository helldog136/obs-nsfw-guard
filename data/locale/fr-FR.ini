NsfwGuard="NSFW Guard"
Threshold="Seuil de sensibilité (%)"
Threshold.Desc="Score à partir duquel une image est jugée sensible. Plus bas = plus strict (plus de faux positifs), plus haut = plus permissif."
SexyWeight="Poids de la classe « sexy » (%)"
SexyWeight.Desc="Part que prend le contenu limite (maillots, lingerie) dans le score. 0 = seul le contenu explicite compte."
Consecutive="Détections consécutives requises"
Consecutive.Desc="Nombre d'analyses positives à la suite avant de masquer. Une valeur plus haute supprime les faux positifs isolés."
HoldMs="Maintenir le masque pendant (ms)"
Mode="Style du masque"
Mode.Black="Noir"
Mode.Pixelate="Pixelisé"
Mode.Blur="Flou gaussien"
PixelSize="Taille des pixels (px de la source)"
PixelSize.Desc="Taille d'un bloc de la pixelisation. Plus petit = image plus lisible, plus grand = plus masqué."
BlurStrength="Intensité du flou"
BlurStrength.Desc="Écart-type du flou gaussien, en pixels de la source. Plus élevé = plus flou."
DelayOn="Retarder l'image pour que le masque arrive à temps"
DelayOn.Desc="Met quelques images en tampon pour appliquer le masque avant d'afficher une image détectée. Ajoute un petit délai vidéo à cette source uniquement."
AutoDelay="Calculer le délai automatiquement"
DelayFrames="Délai (images)"
Interval="Analyser une image sur"
Method="Méthode d'analyse"
Method.Desc="L'image entière est réduite en 224×224 avant analyse, ce qui peut effacer les petits éléments. Les autres méthodes regardent aussi des zones de l'image, réduites moins fortement. Une zone aléatoire change à chaque analyse et est ré-analysée tant qu'elle reste positive."
Method.Whole="Image entière réduite (1 analyse, le plus léger)"
Method.Zone="Zone aléatoire (1 analyse, plus détaillé sur une partie de l'écran)"
Method.Mixed="Mixte : image entière + zone aléatoire (2 analyses)"
Method.Grid2="Image entière + grille 2×2 fixe (5 analyses, environ 5× plus de calcul)"
Method.Grid3="Image entière + grille 3×3 fixe (10 analyses, environ 10× plus de calcul)"
Method.Grid4="Image entière + grille 4×4 fixe (17 analyses, environ 17× plus de calcul)"
ZoneSize="Taille de la zone aléatoire (px de la source)"
ZoneSize.Desc="Côté de la zone carrée analysée. 224 = pixels de la source tels quels (le plus détaillé). Plus grand = zone plus vaste, mais réduite (un peu moins détaillée)."
Method.WarningLabel="Attention"
Method.Warning="Cette méthode multiplie le travail d'analyse : elle consomme nettement plus de processeur (ou de GPU) et allonge le délai automatique de l'image. Surveillez l'utilisation du CPU et activez le journal de débogage pour voir le temps d'analyse. Sur une machine modeste, gardez « Image entière réduite » ou « Zone aléatoire », ou augmentez l'intervalle d'analyse."
UseDml="Utiliser le GPU (DirectML) au lieu du CPU"
UseDml.Desc="Le CPU suffit (environ 1 ms par image) et ne concurrence pas le jeu sur le GPU."
BlockUntilReady="Masquer la source tant que le modèle IA n'est pas prêt"
Debug="Journaliser scores et temps (débogage)"
